name: Sapphire Ventures
description: >-
  Sapphire Ventures is a global software venture capital firm that partners with
  expansion-stage enterprise technology companies it believes can become category
  leaders. Originally founded in 1996 as the venture arm of SAP, the firm spun out
  as an independent company in 2011 and rebranded to Sapphire Ventures in 2014.
  Sapphire manages over $10 billion in assets under management and typically invests
  Series B through IPO, with check sizes commonly ranging from roughly $2M to $30M,
  while its Sapphire Sport and Sapphire Partners arms address early-stage sports/media
  and fund investing respectively. The firm concentrates on Enterprise AI and B2B
  software, including data and analytics, cybersecurity, DevOps and developer tools,
  fintech, health tech, and vertical SaaS. Headquartered in Austin, Texas, with offices
  in San Francisco, Menlo Park, New York, and London, Sapphire backs companies of
  consequence and supports them with a large platform team that drives executive talent
  and customer introductions. The portfolio spans 30+ IPOs and 80+ exits including
  DocuSign, Square, Wise, monday.com, JFrog, Auth0, MuleSoft, and LinkedIn.
